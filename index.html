<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designers</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
        }
        header {
            padding: 60px 20px;
        }
        h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        p {
            font-size: 21px;
            font-weight: 400;
            color: #86868b;
            margin-bottom: 30px;
        }
        .cta-button {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 12px 28px;
            font-size: 17px;
            font-weight: 400;
            border-radius: 22px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: #0077ed;
        }
        .instagram-section {
            margin-top: 60px;
            padding: 40px;
            background-color: white;
            border-radius: 18px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Designers</h1>
        <p>Crafting premium custom websites for your vision.</p>
        <a href="#" class="cta-button">Order Now</a>
    </header>

    <div class="instagram-section">
        <h2>Connect with us</h2>
        <p>Check out our latest work on Instagram.</p>
        <a href="https://instagram.com/yourhandle" class="cta-button">Follow on Instagram</a>
    </div>

</body>
</html>
